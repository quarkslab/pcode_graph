name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[test,torch]
      - run: python -m pytest tests